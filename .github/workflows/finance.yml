name: Finance checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tinyfinance-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tinyfinance-v2/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run test:db
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: CHROMIUM_PATH="$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux*/chrome' -type f | head -1)" npm run test:e2e
